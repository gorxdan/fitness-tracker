name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Sign, export, upload
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate
        env:
          DIST_P12: ${{ secrets.DIST_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          security create-keychain -p build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          echo "$DIST_P12" | base64 --decode > dist.p12
          security import dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k build build.keychain

      - name: Install provisioning profile
        env:
          PROFILE: ${{ secrets.PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/pulse.mobileprovision
          security cms -D -p ~/Library/MobileDevice/Provisioning\ Profiles/pulse.mobileprovision > decoded.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" decoded.plist)
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" decoded.plist)
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          xcodebuild archive -project Pulse.xcodeproj -scheme Pulse \
            -destination 'generic/platform=iOS' \
            -archivePath build/Pulse.xcarchive \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export IPA
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          sed -e "s/__TEAM__/$ASC_TEAM_ID/" -e "s/__PROFILE_NAME__/$PROFILE_NAME/" \
            scripts/ExportOptions.plist > ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/Pulse.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app --type ios -f build/Pulse.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Attach IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-ipa
          path: build/Pulse.ipa
          retention-days: 30
