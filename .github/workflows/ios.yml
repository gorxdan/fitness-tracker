name: iOS build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: PulseCore (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Unit tests
        run: cd PulseCore && swift test

  build:
    name: Generate, build, test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (iOS Simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Pulse.xcodeproj -scheme Pulse \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-app
          path: build/DD/Build/Products/*/Pulse.app
          retention-days: 30

      - name: PulseCore unit tests
        run: |
          cd PulseCore && swift test
