name: iOS build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Generate, build, test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (iOS Simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Pulse.xcodeproj -scheme Pulse \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: PulseCore unit tests
        run: |
          cd PulseCore && swift test
